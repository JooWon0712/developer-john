<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="dark">
  <title>덮은 노트북 위에서 잠든 웜뱃 · developer-john</title>
  <style>
    :root { color-scheme: dark; font-family: "Malgun Gothic", system-ui, sans-serif; background: #0e2024; color: #f1f3e8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1200px, 100%); margin: 0 auto; padding: 48px 24px; }
    .status { margin: 0 0 12px; color: #91d4bc; font-size: 14px; letter-spacing: .04em; }
    h1 { margin: 0 0 28px; font-size: clamp(24px, 4vw, 38px); line-height: 1.4; }
    figure { margin: 0; border: 1px solid #42666a; border-radius: 12px; overflow: hidden; background: #173238; }
    img { display: block; width: 100%; height: auto; }
    figcaption { padding: 16px 20px; color: #b2c8c3; font-size: 14px; line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 24px; }
    a { color: #91d4bc; text-underline-offset: 4px; line-height: 1.7; }
    a:hover { color: #f1f3e8; }
    a:focus-visible { outline: 2px solid #e5bd86; outline-offset: 5px; border-radius: 2px; }
    @media (max-width: 600px) { main { padding: 28px 16px; } figcaption { padding: 14px 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="status">선택 시안 · 다크모드 적용</p>
      <h1>덮은 노트북 위에서 잠든 웜뱃</h1>
    </header>
    <figure>
      <img src="./harbor-night-desk-sleep-v1.webp" width="1536" height="1024" alt="안경을 벗은 회색 아기 웜뱃이 밤의 항구 카페에서 덮은 노트북 위에 팔과 머리를 올리고 잠든 픽셀 그림">
      <figcaption>안경을 내려놓고 덮은 노트북 위에서 잠든 그림을 다크모드에 적용했습니다. 이전 낮 그림과 빈 의자의 밤 그림도 함께 보관합니다.</figcaption>
    </figure>
    <nav aria-label="그림 원본과 저장된 그림">
      <a href="./harbor-night-desk-sleep-v1.png">추가 시안 PNG 원본</a>
      <a href="/images/home/harbor-cafe-cozy-pixel-light-clean-v1.webp">저장된 낮 그림</a>
      <a href="/images/home/harbor-cafe-cozy-pixel-night-cleared-v1.webp">저장된 밤 그림 · 빈 의자</a>
    </nav>
  </main>
</body>
</html>
