<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>홈 모바일 미리보기 | developer-john</title>
  <style>
    :root{color-scheme:dark;font-family:"Cascadia Code",Consolas,"Malgun Gothic",monospace;background:#101923;color:#fff7e9}
    *{box-sizing:border-box}body{margin:0}a{color:#e9b66d;text-underline-offset:5px}a:focus-visible{outline:2px solid #e9b66d;outline-offset:5px}
    main{width:min(1180px,calc(100% - 40px));margin:28px auto 48px}header{margin-bottom:26px}nav{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px;font-size:13px}
    h1{margin:12px 0;font-size:clamp(22px,3vw,30px);line-height:1.5}header p{color:#a9b5c0;font-size:13px;line-height:1.9;margin:0}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:24px 20px}.card{min-width:0;margin:0;border:1px solid #3b4c5e;border-radius:10px;overflow:hidden;background:#0c131b;scroll-margin-top:20px}
    figcaption{padding:17px 16px;min-height:124px;border-bottom:1px solid #3b4c5e;background:#172432}h2{font-size:16px;margin:0 0 10px;line-height:1.5;font-weight:500}h2 span{margin-right:8px;color:#e9b66d}
    figcaption p{font-size:11px;line-height:1.8;color:#a9b5c0;margin:0}figure>a{display:block}img{display:block;width:100%;height:auto}footer{margin-top:24px;color:#a9b5c0;font-size:11px;line-height:1.8}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:550px){main{width:calc(100% - 32px);margin-top:20px}.grid{grid-template-columns:minmax(0,1fr);gap:24px}.card{max-width:390px;width:100%;justify-self:center}figcaption{min-height:0}}
  </style>
</head>
<body><main>
  <header><nav aria-label="미리보기 이동"><a href="index.html">← 데스크톱 시안 비교</a><a href="/">현재 홈</a></nav><h1>모바일에서는 이렇게 보여요.</h1><p>390px 너비에서 캡처한 실제 화면입니다. 이미지를 누르면 크게 볼 수 있습니다.</p></header>
  <div class="grid">
    <figure class="card" id="current"><figcaption><h2><span>현재</span>04 사진 위의 소개</h2><p>사진 → 소개 → 서비스<br>모바일에서는 사진과 소개를 세로로 분리</p></figcaption><a href="mobile/current.jpg" aria-label="현재 홈 모바일 화면 확대"><img src="mobile/current.jpg" alt="항구의 웜뱃 사진 아래 소개와 서비스 링크가 이어지는 현재 홈의 모바일 화면" width="374" height="1148"></a></figure>
    <figure class="card" id="concept-01"><figcaption><h2><span>01</span>겹친 창</h2><p>소개 → 서비스 → 사진<br>창이 조금씩 엇갈린 배치</p></figcaption><a href="mobile/01.jpg" aria-label="01 겹친 창 모바일 화면 확대"><img src="mobile/01.jpg" alt="01 겹친 창 시안의 모바일 화면" width="374" height="1151"></a></figure>
    <figure class="card" id="concept-02"><figcaption><h2><span>02</span>넓은 사진창</h2><p>사진 → 소개 → 서비스<br>항구 사진을 먼저 보여주는 구성</p></figcaption><a href="mobile/02.jpg" aria-label="02 넓은 사진창 모바일 화면 확대"><img src="mobile/02.jpg" alt="02 넓은 사진창 시안의 모바일 화면" width="374" height="1045"></a></figure>
    <figure class="card" id="concept-03"><figcaption><h2><span>03</span>하나의 창</h2><p>소개 → 서비스 → 사진<br>하나의 창 안에서 세로로 이어지는 구성</p></figcaption><a href="mobile/03.jpg" aria-label="03 하나의 창 모바일 화면 확대"><img src="mobile/03.jpg" alt="03 하나의 창 시안의 모바일 화면" width="374" height="1016"></a></figure>
    <figure class="card" id="concept-04"><figcaption><h2><span>04</span>사진 위의 소개</h2><p>사진 → 소개 → 서비스<br>모바일에서는 사진과 글이 겹치지 않게 분리</p></figcaption><a href="mobile/04.jpg" aria-label="04 사진 위의 소개 모바일 화면 확대"><img src="mobile/04.jpg" alt="04 시안에서 사진 아래에 소개가 분리되어 표시되는 모바일 화면" width="374" height="1016"></a></figure>
    <figure class="card" id="concept-05"><figcaption><h2><span>05</span>항구의 엽서</h2><p>엽서 사진 → 소개 → 서비스<br>크림색 테두리와 큰 서비스 링크 유지</p></figcaption><a href="mobile/05.jpg" aria-label="05 항구의 엽서 모바일 화면 확대"><img src="mobile/05.jpg" alt="05 항구의 엽서 시안의 모바일 화면" width="374" height="1090"></a></figure>
  </div>
  <footer>모바일 뷰포트에서 캡처한 전체 페이지 이미지입니다. 실제 링크 동작은 각 시안 원본에서 확인할 수 있습니다.</footer>
</main></body></html>
