<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="developer-john 터미널 제목바와 작은 작업실 제목을 담은 기본안·추가 공유 이미지 10안을 비교합니다.">
    <title>작은 작업실 · 터미널 공유 이미지</title>
    <link rel="stylesheet" href="styles.css">
    <script src="variants.js" defer></script>
    <script src="gallery.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#comparison">공유 이미지 비교로 건너뛰기</a>
    <div class="container">
      <header class="page-header">
        <h1>작은 작업실 · 터미널 공유 이미지</h1>
        <p class="lead">기본안과 10가지 디자인·문구 시안을 비교합니다.</p>
        <nav class="page-links" aria-label="관련 페이지">
          <a href="/">현재 홈 보기 <span aria-hidden="true">↗</span></a>
          <a href="../social-home-screenshot/index.html">이전 공유 이미지 시안 <span aria-hidden="true">↗</span></a>
        </nav>
      </header>
      <div class="comparison-note">
        <p>이미지를 누르면 크게 볼 수 있습니다. 확대 화면에서 이전·다음 버튼이나 좌우 방향키로 이동하세요.</p>
        <span>기본안 1장 · 추가 시안 10장</span>
      </div>
      <main id="comparison" tabindex="-1" aria-label="터미널 공유 이미지 비교">
        <div id="concept-grid" class="concept-grid">
          <article class="concept-card baseline-card" data-id="baseline">
            <header class="card-heading">
              <p class="card-label">기준 이미지</p>
              <h2>기본안 · 제목 가운데 배치</h2>
            </header>
            <p class="card-copy">개발자 John의 작은 작업실</p>
            <a class="preview-link" data-id="baseline" href="baseline.jpg" target="_blank" rel="noopener" aria-label="기본안 · 제목 가운데 배치 크게 보기">
              <img src="baseline.jpg" width="1200" height="630" loading="eager" decoding="async" alt="developer-john 터미널 제목바 아래 개발자 John의 작은 작업실 제목을 가운데 배치한 기본안.">
            </a>
            <footer class="card-footer">
              <a href="baseline.jpg" target="_blank" rel="noopener" aria-label="기본안 원본 새 탭에서 보기">원본 <span aria-hidden="true">↗</span></a>
              <a href="baseline.jpg" download="baseline.jpg" aria-label="기본안 JPEG 다운로드">다운로드 <span aria-hidden="true">↓</span></a>
            </footer>
          </article>
        </div>
      </main>
      <footer class="page-footer">developer-john · 개발자 John의 작은 작업실</footer>
    </div>

    <dialog id="image-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-copy">
      <header class="dialog-header">
        <div>
          <h2 id="dialog-title" aria-live="polite">공유 이미지 확대</h2>
          <p id="dialog-copy"></p>
        </div>
        <button id="dialog-close" class="button" type="button" autofocus>닫기 <span aria-hidden="true">×</span></button>
      </header>
      <div class="dialog-stage"><img id="dialog-image" width="1200" height="630" alt=""></div>
      <footer class="dialog-toolbar">
        <div class="dialog-navigation" role="group" aria-label="기본안과 시안 이동">
          <button id="dialog-previous" class="button" type="button"><span aria-hidden="true">←</span> 이전</button>
          <span id="dialog-counter"></span>
          <button id="dialog-next" class="button" type="button">다음 <span aria-hidden="true">→</span></button>
        </div>
        <div class="dialog-files">
          <a id="dialog-original" target="_blank" rel="noopener">원본 보기 <span aria-hidden="true">↗</span></a>
          <a id="dialog-download" download>다운로드 <span aria-hidden="true">↓</span></a>
        </div>
      </footer>
    </dialog>
  </body>
</html>
